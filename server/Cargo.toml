[package]
name = "anmeldung-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
