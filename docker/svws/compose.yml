# SVWS-Server (REST API and web client, server side of SchILD-NRW 3) with
# MariaDB, for testing the connection to the school database (backlog M1/N2,
# Future: SVWS adapter). Development/test only; bound to localhost.
# Use via the Makefile: make svws-init | svws-up | svws-down | svws-logs
name: anmeldung-svws

services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?run make svws-env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gymabi}
      MARIADB_USER: ${MARIADB_USER:-svws}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?run make svws-env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"

  svws:
    image: svwsnrw/svws-server:${SVWS_VERSION:-1.4.1}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gymabi}
      MARIADB_USER: ${MARIADB_USER:-svws}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      # import the official test school (GymAbi) - only on `make svws-init`
      IMPORT_TEST_DATA: ${IMPORT_TEST_DATA:-false}
      SVWS_TLS_KEYSTORE_PASSWORD: ${SVWS_TLS_KEYSTORE_PASSWORD:?run make svws-env}
      SVWS_TLS_CERT_CN: localhost
      JAVA_OPTS: -Xmx2G
    volumes:
      # svwsconfig.json and the self-signed keystore persist here
      - svws-conf:/opt/app/svws/conf
    ports:
      - "127.0.0.1:${SVWS_PORT:-8443}:8443"

volumes:
  mariadb-data:
  svws-conf:
