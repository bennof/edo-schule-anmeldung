# Every push: type checks, lints and unit tests. Only tests that need no
# tenant and no credentials (integration, browser, SVWS and mail tests run
# locally against the test systems). Also called by release.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.8.1
      - name: System packages (musl, WebKitGTK for the desktop app)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            desktop -> target
      - run: make check
      - run: make test
