# nginx snippet for edo-anmeldung-server (server on 127.0.0.1:23180).
# Copy to /etc/nginx/snippets/ and include it in a location of the HTTPS site:
#
#   location /anmeldung/ {
#       include snippets/edo-anmeldung.conf;
#   }
#
# The location prefix is removed before forwarding (/anmeldung/api/... -> /api/...).
# In /etc/edo-anmeldung-server/config.env: TRUST_PROXY=1.

proxy_pass http://127.0.0.1:23180/;
proxy_http_version 1.1;
proxy_set_header Host $host;
# the server takes the first entry: set it to the real client address,
# never append ($proxy_add_x_forwarded_for), or clients could fake it
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# uploads are up to 4 MB per file; the server enforces its own limits
client_max_body_size 5m;
